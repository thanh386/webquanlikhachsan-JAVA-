# Server Port (Tùy chọn nếu muốn đổi cổng chạy web)
server.port=8080

# Database configuration
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=hotel_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=thanh
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=create 
spring.jpa.show-sql=true
# Sử dụng Dialect hiện đại hơn
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServer2012Dialect
# Giúp Hibernate định dạng SQL trong console cho dễ đọc
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf (Hữu ích khi vừa code giao diện vừa xem thay đổi ngay)
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Upload file (Cần thiết cho tính năng 1 - Lưu ảnh phòng nếu cần)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

spring.security.user.name=admin
spring.security.user.password=123

