<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin-layout}"
      th:with="pageTitle='Tạo đặt phòng mới'">
<body>
<section layout:fragment="content" class="space-y-8">
    <section class="soft-card rounded-[34px] bg-white p-8 shadow-soft" data-reveal>
        <div class="max-w-3xl">
            <p class="text-sm font-semibold uppercase tracking-[0.24em] text-gold-500">Manual Booking / Walk-in</p>
            <h1 class="mt-3 text-4xl font-bold text-slate-900">Tạo đặt phòng trực tiếp.</h1>
            <p class="mt-4 text-base leading-8 text-slate-500">
                Sử dụng cho khách walk-in (đến trực tiếp không qua website) hoặc khách đặt qua điện thoại. Nhân viên cần nhập đúng Username của khách hàng để liên kết hệ thống.
            </p>
        </div>
    </section>

    <div class="mx-auto max-w-4xl">
        <form th:action="@{/quan-tri/luot-dat/tao-moi}" method="post" class="soft-card rounded-[34px] bg-white p-10 shadow-soft space-y-6" data-reveal>
            <div class="grid gap-6 md:grid-cols-2">
                <!-- Chọn phòng -->
                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-wider text-slate-400">Chọn phòng</label>
                    <select name="roomId" required class="w-full rounded-2xl border-slate-100 bg-slate-50 px-4 py-3 text-sm focus:border-navy-950 focus:ring-0">
                        <option value="">-- Chọn phòng trống --</option>
                        <option th:each="room : ${rooms}" 
                                th:value="${room.id}" 
                                th:text="${'Phòng ' + room.roomNumber + ' (' + room.type + ') - ' + #numbers.formatDecimal(room.priceInVnd, 0, 'COMMA', 0, 'POINT') + ' VNĐ'}">
                        </option>
                    </select>
                </div>

                <!-- Tài khoản khách -->
                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-wider text-slate-400">Username khách hàng</label>
                    <input type="text" name="customerUsername" required placeholder="Nhập username hệ thống" class="w-full rounded-2xl border-slate-100 bg-slate-50 px-4 py-3 text-sm focus:border-navy-950 focus:ring-0" />
                </div>

                <!-- Ngày nhận -->
                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-wider text-slate-400">Ngày nhận phòng</label>
                    <input type="date" name="checkInDate" required th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}" class="w-full rounded-2xl border-slate-100 bg-slate-50 px-4 py-3 text-sm focus:border-navy-950 focus:ring-0" />
                </div>

                <!-- Ngày trả -->
                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-wider text-slate-400">Ngày trả phòng</label>
                    <input type="date" name="checkOutDate" required th:value="${#temporals.format(#temporals.createNow().plusDays(1), 'yyyy-MM-dd')}" class="w-full rounded-2xl border-slate-100 bg-slate-50 px-4 py-3 text-sm focus:border-navy-950 focus:ring-0" />
                </div>

                <!-- Số khách -->
                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-wider text-slate-400">Số lượng khách</label>
                    <input type="number" name="guestCount" required min="1" value="1" class="w-full rounded-2xl border-slate-100 bg-slate-50 px-4 py-3 text-sm focus:border-navy-950 focus:ring-0" />
                </div>

                <!-- Tên khách thực tế -->
                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-wider text-slate-400">Tên khách lưu trú (nếu khác account)</label>
                    <input type="text" name="guestName" placeholder="Tên khách thực tế" class="w-full rounded-2xl border-slate-100 bg-slate-50 px-4 py-3 text-sm focus:border-navy-950 focus:ring-0" />
                </div>

                <!-- SĐT khách -->
                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-wider text-slate-400">Số điện thoại khách</label>
                    <input type="tel" name="guestPhone" placeholder="09xx xxx xxx" class="w-full rounded-2xl border-slate-100 bg-slate-50 px-4 py-3 text-sm focus:border-navy-950 focus:ring-0" />
                </div>

                <!-- Yêu cầu đặc biệt -->
                <div class="space-y-2 md:col-span-2">
                    <label class="text-xs font-bold uppercase tracking-wider text-slate-400">Yêu cầu đặc biệt</label>
                    <textarea name="specialRequests" rows="3" placeholder="Ghi chú thêm..." class="w-full rounded-2xl border-slate-100 bg-slate-50 px-4 py-3 text-sm focus:border-navy-950 focus:ring-0"></textarea>
                </div>
            </div>

            <div class="pt-6 flex gap-4">
                <button type="submit" class="flex-1 rounded-2xl bg-gold-500 py-4 text-sm font-bold text-navy-950 shadow-lg transition hover:bg-gold-600">
                    <i class="fa-solid fa-calendar-plus mr-2"></i> Xác nhận đặt phòng
                </button>
                <a th:href="@{/quan-tri/luot-dat}" class="flex-1 rounded-2xl bg-slate-100 py-4 text-center text-sm font-bold text-slate-600 transition hover:bg-slate-200">
                    Hủy bỏ
                </a>
            </div>
        </form>
    </div>
</section>
</body>
</html>
