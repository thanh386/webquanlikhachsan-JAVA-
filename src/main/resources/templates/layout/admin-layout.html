<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: appHead(${pageTitle} ?: 'Admin Portal')}"></head>
<body class="bg-slate-50 font-sans text-slate-900 antialiased">
<div id="toast-root" class="pointer-events-none fixed right-4 top-4 z-[80] flex w-[min(360px,calc(100vw-2rem))] flex-col gap-3"></div>
<div th:if="${success}" class="hidden" data-toast-message th:attr="data-toast-message=${success},data-toast-type='success'"></div>
<div th:if="${error}" class="hidden" data-toast-message th:attr="data-toast-message=${error},data-toast-type='error'"></div>

<div class="min-h-screen bg-slate-50 lg:pl-72">
    <aside th:replace="~{fragments/admin-sidebar :: sidebar(${activePage})}"></aside>
    <div class="min-h-screen">
        <div th:replace="~{fragments/admin-topbar :: topbar}"></div>
        <main class="px-4 py-8 sm:px-6 lg:px-10" layout:fragment="content"></main>
    </div>
</div>

<div th:replace="~{fragments/modal :: confirmModal}"></div>
</body>
</html>
