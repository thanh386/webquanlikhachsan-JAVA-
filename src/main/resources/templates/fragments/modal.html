<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="confirmModal" data-confirm-modal-root class="pointer-events-none fixed inset-0 z-[90] hidden items-center justify-center px-4">
    <div data-confirm-overlay class="absolute inset-0 bg-slate-950/55 backdrop-blur-sm"></div>
    <div class="relative w-full max-w-md rounded-[30px] bg-white p-7 shadow-floating">
        <div class="mb-5 flex h-14 w-14 items-center justify-center rounded-full bg-red-50 text-red-500">
            <i class="fa-solid fa-triangle-exclamation text-xl"></i>
        </div>
        <h3 data-confirm-title class="text-2xl font-bold text-slate-900">Xác nhận thao tác</h3>
        <p data-confirm-message class="mt-3 text-sm leading-7 text-slate-500">Bạn có chắc chắn muốn tiếp tục thao tác này không?</p>
        <div class="mt-7 flex flex-col gap-3 sm:flex-row sm:justify-end">
            <button type="button" data-confirm-cancel class="rounded-full border border-slate-200 px-5 py-3 text-sm font-semibold text-slate-600 transition duration-300 hover:bg-slate-100">Đóng</button>
            <button type="button" data-confirm-submit class="rounded-full bg-gradient-to-r from-red-500 to-red-400 px-5 py-3 text-sm font-semibold text-white shadow-lg transition duration-300 hover:-translate-y-0.5">Xác nhận</button>
        </div>
    </div>
</div>
</body>
</html>
